name: ragtruth
path: /share/home/tm902089733300000/a903202310/lys/data/RAGTruth/dataset
cls_path: src.data.ragtruth.RAGTruthDataset

# RAGTruth specific settings
# 已有 splits 配置，不需要运行 split_dataset
splits:
  - test
  - train
task_types:  null  # null means all types:  QA, Summary, Data2txt
max_samples: null
exclude_quality: 
  - incorrect_refusal
  - truncated

# For feature extraction
max_answer_tokens: 512
target_column_name: response
test_split_name: test

# Train/test split ratio (for datasets WITHOUT split information)
# RAGTruth already has splits, so these are ignored
# train_ratio: 0.9
# split_seed: null
# force_split: false
# DVC Pipeline for Hallucination Detection
# All parameters are now managed via Hydra configs
# Usage: dvc repro

stages:
  # Stage 1: Generate activations (extract features)
  generate_activations: 
    cmd: python scripts/generate_activations.py
    deps:
      - scripts/generate_activations.py
      - src/
      - config/
    params:
      - config/config.yaml:
          - dataset
          - model
          - features
          - seed
    outs: 
      - outputs/features/

  # Stage 2: Train probe
  train_probe: 
    cmd: python scripts/train_probe.py
    deps:
      - scripts/train_probe. py
      - src/
      - outputs/features/
    params:
      - config/config.yaml:
          - method
          - seed
    outs: 
      - outputs/models/

  # Stage 3: Evaluate
  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - scripts/evaluate.py
      - outputs/models/
      - outputs/features/
    metrics:
      - outputs/models/**/eval_results.json:
          cache: false

  # Stage 4: LLM Judge (optional)
  llm_judge: 
    cmd: python scripts/llm_judge.py
    deps:
      - scripts/llm_judge.py
      - src/
    params:
      - config/config.yaml:
          - dataset
          - llm_api
    outs:
      - outputs/results/llm_judge/
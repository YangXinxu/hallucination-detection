# =============================================================================
# DVC Parameters - 矩阵式参数配置
# =============================================================================
# 修改这些值后运行 `dvc repro` 即可重新运行整个流水线
# 支持矩阵交叉：所有 datasets × models × methods 的组合都会被执行

# -----------------------------------------------------------------------------
# 数据集配置
# -----------------------------------------------------------------------------
# RAGTruth 子数据集列表 (task_types)
# 设置为 null 表示运行所有类型，或指定列表如 [QA, Summary, Data2txt]
datasets:
  - name: ragtruth
    task_types: null  # null = 所有类型 (QA, Summary, Data2txt)
    splits: [train, test]

# 如果需要分别运行每个 task_type，使用以下配置:
# datasets:
#   - name: ragtruth
#     task_types: [QA]
#     splits: [train, test]
#   - name: ragtruth
#     task_types: [Summary]
#     splits: [train, test]
#   - name: ragtruth
#     task_types: [Data2txt]
#     splits: [train, test]

# -----------------------------------------------------------------------------
# 模型配置
# -----------------------------------------------------------------------------
models:
  - name: mistral_7b
    path: /share/home/tm902089733300000/a903202310/lys/models/Mistral-7B-Instruct-v0.3

# 多模型示例:
# models:
#   - name: mistral_7b
#     path: path/to/mistral
#   - name: llama3_8b
#     path: path/to/llama

# -----------------------------------------------------------------------------
# 检测方法配置
# -----------------------------------------------------------------------------
# 要运行所有方法，取消下面的注释并注释掉单方法配置
methods:
  - lapeigvals
  - entropy
  - lookback_lens
  - hypergraph
  - ensemble

# 单方法运行示例:
# methods:
#   - lapeigvals

# -----------------------------------------------------------------------------
# 特征提取配置
# -----------------------------------------------------------------------------
features:
  mode: teacher_forcing  # teacher_forcing or generation
  attention_layers: all
  max_length: 4096

# -----------------------------------------------------------------------------
# 其他配置
# -----------------------------------------------------------------------------
seed: 42
cv_folds: 5
# =============================================================================
# DVC Parameters - 矩阵式参数配置
# =============================================================================
# 修改这些值后运行 `dvc repro` 即可重新运行整个流水线
# 支持矩阵交叉：所有 datasets × models × methods 的组合都会被执行

# -----------------------------------------------------------------------------
# 数据集配置
# -----------------------------------------------------------------------------
datasets:
  - name: ragtruth

# -----------------------------------------------------------------------------
# 模型配置
# -----------------------------------------------------------------------------
models: 
  - name: mistral_7b
    path: /share/home/tm902089733300000/a903202310/lys/models/Mistral-7B-Instruct-v0.3

# -----------------------------------------------------------------------------
# 检测方法配置
# -----------------------------------------------------------------------------
methods: 
  - lapeigvals
  - entropy
  - lookback_lens
  - hypergraph
  - ensemble

# -----------------------------------------------------------------------------
# 特征提取配置
# -----------------------------------------------------------------------------
features: 
  mode: teacher_forcing  # teacher_forcing or generation
  attention_layers: all
  max_length: 4096

# -----------------------------------------------------------------------------
# 其他配置
# -----------------------------------------------------------------------------
seed: 42
cv_folds: 5